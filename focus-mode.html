<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus mode</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14213d;--mute:#5d6b82;--line:#d5dce6;--accent:#1f6f8b;--accent-ink:#fff;--bar:#b9d3de;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--panel:#17203a;--ink:#e8edf6;--mute:#9aa8c2;--line:#2a3658;--accent:#6cc4e0;--accent-ink:#0f1624;--bar:#2f4a66}}
:root[data-theme="dark"]{--bg:#0f1624;--panel:#17203a;--ink:#e8edf6;--mute:#9aa8c2;--line:#2a3658;--accent:#6cc4e0;--accent-ink:#0f1624;--bar:#2f4a66}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%;line-height:1.5}
main{max-width:880px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:20px;grid-template-columns:1.3fr 1fr}
@media(max-width:760px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
h1{font-size:1.1rem;margin:0 0 16px;font-weight:800}
h2{font-size:.95rem;margin:0 0 12px;font-weight:600;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:20px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:7px 18px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.dial{position:relative;width:min(100%,320px);aspect-ratio:1;margin:0 auto 16px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:8}
.track{stroke:var(--line)}
.prog{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#clock{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#state{color:var(--mute);font-size:.9rem}
.set{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.set label{color:var(--mute);font-size:.9rem;display:flex;align-items:center;gap:6px}
input[type=number]{width:70px;font:inherit;font-weight:600;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:.85rem;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.ctrl{display:flex;gap:10px;justify-content:center}
.btn{font:inherit;font-weight:800;padding:12px 28px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:130px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.total{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;margin:0 0 4px}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 22px}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;margin-bottom:6px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center}
.col i{display:block;width:100%;background:var(--bar);border-radius:6px 6px 0 0;min-height:3px}
.col.today i{background:var(--accent)}
.labels{display:flex;gap:8px;font-size:.75rem;color:var(--mute)}
.labels span{flex:1;text-align:center}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;margin-top:18px;padding:0}
@media(prefers-reduced-motion:reduce){.prog{transition:none}}
</style>
</head>
<body>
<main>
  <section aria-label="Timer">
    <h1>Focus mode</h1>
    <div class="seg" role="group" aria-label="Timer type">
      <button id="mDown" aria-pressed="true">Countdown</button>
      <button id="mUp" aria-pressed="false">Stopwatch</button>
    </div>
    <div class="dial">
      <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="45"/><circle class="prog" id="ring" cx="50" cy="50" r="45" stroke-dasharray="282.74" stroke-dashoffset="0"/></svg>
      <div class="time"><div id="clock">00:00:00</div><div id="state">Ready</div></div>
    </div>
    <div id="setup">
      <div class="set">
        <label>Hours <input id="h" type="number" min="0" max="23" value="0"></label>
        <label>Minutes <input id="m" type="number" min="0" max="59" value="25"></label>
      </div>
      <div class="presets">
        <button class="chip" data-min="25">25 min</button>
        <button class="chip" data-min="50">50 min</button>
        <button class="chip" data-min="90">1h 30m</button>
        <button class="chip" data-min="120">2 hours</button>
      </div>
    </div>
    <div class="ctrl">
      <button class="btn main" id="go">Start focus</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </section>

  <section aria-label="Study time">
    <h2>Studied today</h2>
    <p class="total" id="today">0h 00m 00s</p>
    <p class="sub" id="sessions">No focus time yet today.</p>
    <h2>Last 7 days</h2>
    <div class="week" id="week"></div>
    <div class="labels" id="wl"></div>
    <button class="link" id="clear">Clear today's total</button>
  </section>
</main>

<script>
(function(){
  var KD='focus.days.v1', KS='focus.state.v1';
  function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var days=load(KD,{});
  var S=load(KS,{mode:'down',target:1500000,elapsed:0,running:false,last:0,count:0});
  S.running=false; // a closed page is not counted as study time
  var $=function(i){return document.getElementById(i)};
  var C=2*Math.PI*45;
  function key(t){var d=new Date(t||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function p2(n){return String(n).padStart(2,'0')}
  function clock(ms){var s=Math.max(0,Math.round(ms/1000));return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)}
  function long(ms){var s=Math.floor(ms/1000);return Math.floor(s/3600)+'h '+p2(Math.floor(s%3600/60))+'m '+p2(s%60)+'s'}
  function beep(){try{var a=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(function(t){var o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.25);o.start(a.currentTime+t);o.stop(a.currentTime+t+.26)})}catch(e){}}
  var finished=false;

  function tick(){
    if(!S.running)return;
    var now=Date.now(),d=now-S.last;S.last=now;
    S.elapsed+=d;
    var k=key(now);days[k]=(days[k]||0)+d;
    if(S.mode==='down'&&S.elapsed>=S.target){
      var ex=S.elapsed-S.target;days[k]=Math.max(0,days[k]-ex);
      S.elapsed=S.target;S.running=false;S.count=(S.count||0)+1;finished=true;beep();
    }
    save(KD,days);save(KS,S);render();
  }

  function render(){
    var left=S.mode==='down'?S.target-S.elapsed:S.elapsed;
    $('clock').textContent=clock(left);
    var frac=S.mode==='down'?(S.target?S.elapsed/S.target:0):((S.elapsed/3600000)%1);
    $('ring').style.strokeDashoffset=C*(S.mode==='down'?frac:1-frac);
    $('state').textContent=S.running?'Focusing':finished?'Session complete':S.elapsed>0?'Paused':'Ready';
    $('go').textContent=S.running?'Pause':S.elapsed>0&&!finished?'Resume':'Start focus';
    $('mDown').setAttribute('aria-pressed',S.mode==='down');
    $('mUp').setAttribute('aria-pressed',S.mode==='up');
    $('setup').style.display=(S.mode==='down'&&!S.running&&S.elapsed===0)?'block':'none';
    document.title=(S.running?clock(left)+' · ':'')+'Focus mode';
    var t=days[key()]||0;
    $('today').textContent=long(t);
    $('sessions').textContent=t?(S.count?S.count+' countdown'+(S.count>1?'s':'')+' finished this session.':'Keep going, every minute counts.'):'No focus time yet today.';
    var wk=[],mx=1,i;
    for(i=6;i>=0;i--){var dt=new Date();dt.setDate(dt.getDate()-i);var v=days[key(dt)]||0;wk.push({v:v,l:dt.toLocaleDateString(undefined,{weekday:'short'}),today:i===0});mx=Math.max(mx,v)}
    $('week').innerHTML=wk.map(function(x){return '<div class="col'+(x.today?' today':'')+'" title="'+long(x.v)+'"><i style="height:'+Math.round(x.v/mx*100)+'%"></i></div>'}).join('');
    $('wl').innerHTML=wk.map(function(x){return '<span>'+x.l+'</span>'}).join('');
  }

  function setTarget(){
    var h=Math.min(23,Math.max(0,parseInt($('h').value)||0)),m=Math.min(59,Math.max(0,parseInt($('m').value)||0));
    S.target=(h*60+m)*60000;if(S.target<60000)S.target=60000;save(KS,S);render();
  }
  function syncInputs(){var mins=Math.round(S.target/60000);$('h').value=Math.floor(mins/60);$('m').value=mins%60}

  $('h').addEventListener('input',setTarget);$('m').addEventListener('input',setTarget);
  document.querySelectorAll('.chip').forEach(function(b){b.addEventListener('click',function(){S.target=b.dataset.min*60000;syncInputs();save(KS,S);render()})});
  $('go').addEventListener('click',function(){
    if(S.running){S.running=false}
    else{
      if(S.mode==='down'&&S.elapsed>=S.target)S.elapsed=0;
      finished=false;S.running=true;S.last=Date.now();
    }
    save(KS,S);render();
  });
  $('reset').addEventListener('click',function(){S.running=false;S.elapsed=0;finished=false;save(KS,S);render()});
  function mode(m){if(S.mode===m)return;S.mode=m;S.running=false;S.elapsed=0;finished=false;save(KS,S);render()}
  $('mDown').addEventListener('click',function(){mode('down')});
  $('mUp').addEventListener('click',function(){mode('up')});
  $('clear').addEventListener('click',function(){if(confirm("Clear today's total study time?")){delete days[key()];S.count=0;save(KD,days);save(KS,S);render()}});

  syncInputs();render();
  setInterval(tick,500);
})();
</script>
</body>
</html>
